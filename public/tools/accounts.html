    :root {

      --surface:#ffffff;

      --text:#202124;
      --text-sub:#5f6368;

    *{box-sizing:border-box}
    body{

    .app{max-width:1480px;margin:0 auto;padding:22px 24px 40px}
    header.hero{

      border:1px solid var(--line-soft);
      border-left:6px solid var(--primary);
      border-radius:var(--radius);
      padding:22px 26px;
      box-shadow:var(--shadow-1);
    }
    header.hero:after{display:none}
    .hero h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
    .hero p{margin:0;line-height:1.55;color:var(--text-sub);font-size:13px}
    .card{
      background:var(--surface);
      border:1px solid var(--line-soft);
      border-radius:var(--radius);
      box-shadow:var(--shadow-1);
      padding:20px;
    }
    .top-grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px;margin-top:16px}
    .card h2{
      margin:0 0 14px;
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
      color:var(--text);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .field-grid.one{grid-template-columns:1fr}
    .field-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    label{display:block;color:var(--text-sub);font-size:12px;font-weight:800;margin-bottom:6px}
    input,select,textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:8px;
      padding:10px 12px;
      font-size:14px;
      background:#fff;
      color:var(--text);
      outline:none;
      transition:border-color .12s ease,box-shadow .12s ease;
    }
    textarea{min-height:42px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.14)}

      justify-content:center;
      gap:6px;
      min-height:38px;
      box-shadow:none;
      transition:background .12s ease,box-shadow .12s ease,transform .02s ease;
    }
    button:hover,.button-like:hover{background:var(--primary-dark);box-shadow:var(--shadow-1);filter:none}
    button:active,.button-like:active{transform:translateY(1px)}

    button.secondary:hover,.button-like.secondary:hover{background:var(--primary-soft);box-shadow:none}
